name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Syntax
        run: composer lint
      - name: Coding standard
        if: matrix.php == '8.2'
        run: composer cs
      - name: Translations
        if: matrix.php == '8.2'
        run: |
          sudo apt-get install -y -qq gettext > /dev/null
          for po in locales/*.po; do msgfmt --check -o /dev/null "$po"; done
      - name: Installer
        if: matrix.php == '8.2'
        run: bash -n install.sh && shellcheck -S warning install.sh
